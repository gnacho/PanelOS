name: Release zip

# HACS and the Home Assistant Marketplace install the integration from
# panelos.zip on each release (hacs.json: zip_release) instead of the whole
# repository archive. This attaches it to every published release.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to attach panelos.zip to
        required: true

permissions:
  contents: write

jobs:
  zip:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Pack custom_components/panelos at the tag
        run: |
          git clone --quiet --depth 1 --branch "$TAG" "https://github.com/$GITHUB_REPOSITORY" src
          git -C src archive --format=zip -o "$PWD/panelos.zip" HEAD:custom_components/panelos
          unzip -l panelos.zip | tail -1
      - name: Attach it to the release
        run: gh release upload "$TAG" panelos.zip --clobber --repo "$GITHUB_REPOSITORY"
