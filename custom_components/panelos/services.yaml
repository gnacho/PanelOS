show_view:
  fields:
    panel_id:
      example: nspanel-pro
      selector:
        text:
    view:
      required: true
      default: home
      selector:
        select:
          translation_key: view
          options:
            - home
            - dashboard
            - weather
            - media
            - camera
    entity_id:
      selector:
        entity:
          domain: camera
    seconds:
      default: 30
      selector:
        number:
          min: 0
          max: 3600
          unit_of_measurement: s

notify:
  fields:
    panel_id:
      example: nspanel-pro
      selector:
        text:
          multiple: true
    title:
      example: Washing machine
      selector:
        text:
    message:
      required: true
      example: The laundry is done.
      selector:
        text:
          multiline: true
    icon:
      example: mdi:washing-machine
      selector:
        icon:
    level:
      default: info
      selector:
        select:
          options:
            - info
            - warning
          translation_key: level
    picture:
      example: camera.front_door
      selector:
        text:
    buttons:
      example: '["Snooze", "Done"]'
      selector:
        text:
          multiple: true
    until_answered:
      default: false
      selector:
        boolean:

show_status:
  fields:
    screen:
      required: true
      example: toilet_occupied
      selector:
        text:

clear_status:
  fields:
    screen:
      required: true
      example: toilet_occupied
      selector:
        text:

critical_alert:
  fields:
    alert:
      required: true
      example: alert_1
      selector:
        text:

clear_critical_alert:
  fields:
    alert:
      required: true
      example: alert_1
      selector:
        text:
